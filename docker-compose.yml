version: "3.8"

services:
  bookhub:
    image: ghcr.io/yikuanzz/book-hub:latest
    container_name: bookhub
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - bookhub-data:/app/backend/data
      - bookhub-uploads:/app/backend/uploads
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3001/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  bookhub-data:
    driver: local
  bookhub-uploads:
    driver: local
